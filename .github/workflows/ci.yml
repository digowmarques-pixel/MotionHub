name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motionhub
          POSTGRES_PASSWORD: motionhub
          POSTGRES_DB: motionhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motionhub" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motionhub/shared build
      - run: pnpm -r typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://motionhub:motionhub@localhost:5432/motionhub_test
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
